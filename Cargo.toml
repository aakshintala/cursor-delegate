[package]
name = "delegate"
version = "1.0.0"
edition = "2024"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
libc = "0.2"

[[bin]]
name = "delegate"
path = "src/bin/delegate.rs"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
