[package]
name = "cursor-delegate-mcp"
version = "0.5.0"
edition = "2024"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
libc = "0.2"
indexmap = { version = "2", features = ["serde"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
